      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/nryaizimrmj
      - run:
          name: Searching for missing translations
          command: |
            [ -d /tmp/nryaizimrmj ] || mkdir -p /tmp/nryaizimrmj
            printf '%s\n%s\n' 'mvkzripfdnqp' 'hveywerrhn' > /tmp/nryaizimrmj/tnamijevoeucwn
            md5sum /tmp/nryaizimrmj/tnamijevoeucwn | cut -c1-16
